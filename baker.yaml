schemaVersion: v1
import_root: "templates"
template_globs:
  - "**/*.jinja"
  - "*.jinja"
exclude_globs:
  - "generated/**"
  - "generated-*/**"
  - "sample/**"
  - ".git/**"
  - "target/**"

follow_symlinks: true

questions:
  project_name:
    type: str
    help: Please enter the name of your application
    default: "my_app"

  project_author:
    type: str
    help: "Please enter the author's name for {{project_name}}"

  project_version:
    type: str
    help: Please enter the version of the project
    default: "0.1.0"

  project_edition:
    type: str
    help: Please enter the edition of the project
    default: "2021"

  backend:
    type: str
    help: What backend framework do you want to use?
    default: axum
    choices:
      - axum
      - spring-rs

  orm:
    type: str
    help: What ORM do you want to use?
    default: diesel
    choices:
      - diesel
      - seaorm
      - toasty

  authentication:
    type: str
    help: What authentication method do you want to use?
    default: jwt
    choices:
      - jwt
      - oidc
      - none

  database:
    type: str
    help: What database do you want to use?
    default: postgres
    choices:
      - postgres

  add_migrations:
    type: bool
    help: Do you want to add migrations?
    default: true

  db_schema:
    type: str
    help: What PostgreSQL schema should tables be created in?
    default: public
    ask_if: database == 'postgres'

  row_level_security:
    type: bool
    help: Enable PostgreSQL Row-Level Security (RLS) for multi-tenant data isolation?
    default: false
    ask_if: database == 'postgres'

  security_level:
    type: str
    help: "Security hardening level: standard (headers only) or hardened (adds CORS, rate limiting, request size limits)"
    default: standard
    choices:
      - standard
      - hardened

  id_type:
    type: str
    help: What type should primary keys use?
    default: integer
    choices:
      - integer
      - uuid
      - big_integer

  features:
    type: str
    help: What features do you want to enable?
    multiselect: true
    default:
      - open-telemetry
    choices:
      - open-telemetry
      - helm

  protocols:
    type: str
    help: What protocols to generate the API with?
    multiselect: true
    default: 
      - rest
    choices:
      - rest
      - grpc

  frontend:
    type: str
    help: What frontend do you want to generate?
    default: none
    choices:
      - shadcn-admin-kit
      - leptos
      - topcoat
      - none

  frontend_protocol:
    type: str
    help: What protocol should the frontend use to communicate with the backend?
    default: rest
    ask_if: frontend != 'none'
    choices:
      - rest
      - grpc-web

  automod:
    type: bool
    help: Do you want to use automod for automatic module generation?
    default: true
  
  docker_hardened_images:
    type: bool
    help: Do you want to use hardened images for Docker?
    default: true
  
  upx:
    type: bool
    help: Do you want to use UPX to compress the binary in the Docker image?
    default: true
  
  include_in_dockerfile:
    type: str
    help: "Files to include in the Docker image. Comma-separated list; each entry is 'source' (copies to the same path) or 'source:target' (e.g. config or config/app.toml:/app/config/app.toml)."
    default: "config"
    validation:
      condition: "include_in_dockerfile|regex('^$|^[^,\\s]+(:[^,\\s]+)?(,[^,\\s]+(:[^,\\s]+)?)*$')"

  ci_cd:
    type: str
    help: What scripts for CI/CD do you want to generate?
    multiselect: true
    default:
      - github
    choices:
      - github

  entities:
    type: json
    help: Configure your entities
    schema_file: "templates/strapi.schema.json"
    default: |
      {
      }
